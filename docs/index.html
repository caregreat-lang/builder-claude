async function aiReadDm(text,platform,handle){

function templateReadDm(text){
  // Conservative fallback: only picks up explicit "my name is / nama saya" phrases; everything else is left missing for you to fill in.
  const nm=text.match(/(?:my name is|i am|i'm|nama saya(?: ialah)?|saya)\s+([A-Z][a-zA-Z'@.-]+(?:\s+(?:bin|binti|a\/l|a\/p|[A-Z][a-zA-Z'.-]+)){0,4})/)
    ||text.match(/(?:我叫|我的名字是|我的名字叫)\s*([一-鿿]{2,4}|[A-Z][a-zA-Z'.-]+(?:\s+[A-Z][a-zA-Z'.-]+){0,3})/);
  // Work sentence by sentence; questions ("ada jawatan intern?") are never taken as the candidate's own details.
  const sentences=text.split(/(?<=[.!?])\s+|(?<=[。！？；])|\n+/).map(s=>s.trim()).filter(s=>s&&!/[?？]$/.test(s));
  const edu=sentences.find(s=>/\b(degree|diploma|bachelor|master|phd|ijazah|sarjana|universiti|university|UiTM|UKM|UPM|UM|USM|Taylor's|Sunway|Monash|STPM|foundation|asasi)\b/i.test(s)||/(大学|学院|学位|文凭|本科|硕士|博士|毕业|独中|统考)/.test(s));
  const exp=sentences.find(s=>/\b(pernah|worked|working at|experience|pengalaman|part[- ]?time|interned|internship at|intern at|latihan industri di)\b/i.test(s)||/(实习过|做过|工作过|兼职|经验|曾在|上班)/.test(s));
  const r={name:nm?nm[1].trim():null,education:edu||null,experience:exp||null,language:detectLang(text),intent:"apply",fallback:true};
  const miss=[!r.name&&"full name",!r.education&&"education background",!r.experience&&"working / internship experience"].filter(Boolean);
  const missMs={"full name":"nama penuh","education background":"latar belakang pendidikan","working / internship experience":"pengalaman kerja / latihan industri"};
  r.reply_en=`Hi${r.name?" "+r.name.split(" ")[0]:""}! Thanks so much for reaching out 🙌\n`+(miss.length?`Could you share your ${miss.join(", ")} and your CV?`:"Could you send us your CV?")+` Our team will get back to you soon.\n(Your details are used only for recruitment.)`;
  const missZh={"full name":"全名","education background":"教育背景","working / internship experience":"工作/实习经验"};
  r.reply_zh=`你好${r.name||""}！谢谢你联系我们 🙌\n`+(miss.length?`可以分享一下你的${miss.map(m=>missZh[m]).join("、")}和简历吗？`:"可以发一下你的简历吗？")+`我们的团队会尽快回复你。\n（你的资料仅用于招聘用途。）`;
  r.reply_ms=`Hai${r.name?" "+r.name.split(" ")[0]:""}! Terima kasih kerana menghubungi kami 🙌\n`+(miss.length?`Boleh kongsikan ${miss.map(m=>missMs[m]).join(", ")} dan CV anda?`:"Boleh hantar CV anda?")+` Team kami akan hubungi anda tidak lama lagi.\n(Maklumat anda hanya digunakan untuk tujuan pengambilan pekerja.)`;
  return r;
}

const HAS_CJK=/[㐀-鿿豈-﫿]/;
async function cjkPdfDoc(list,sub,NA){
  const el=document.createElement("div");
  el.style.cssText="position:absolute;left:-12000px;top:0;width:1100px;background:#fff;color:#151A2D;font:13px/1.45 'Plus Jakarta Sans','Microsoft YaHei','PingFang SC','Noto Sans SC','Noto Sans CJK SC',sans-serif";
  const cell="padding:8px;border-bottom:1px solid #E3E6EF;vertical-align:top;text-align:left";
  const widths=[40,160,260,300,140,100];
  el.innerHTML=`<div style="font-size:24px;font-weight:700;margin-bottom:4px">Candidate List</div><div style="color:#5D6480;margin-bottom:14px">${esc(sub)}</div>
    <table style="border-collapse:collapse;width:100%"><thead><tr style="background:#151A2D;color:#fff">${["No.","NAME","EDUCATION BACKGROUND","WORKING EXPERIENCE","Source","Status"].map((h,i)=>`<th style="${cell};width:${widths[i]}px">${h}</th>`).join("")}</tr></thead>
    <tbody>${list.map((c,i)=>`<tr style="background:${i%2?"#F5F6FA":"#fff"}"><td style="${cell}">${i+1}</td>${[c.name,c.education,c.experience].map(v=>`<td style="${cell}">${v?esc(v):`<i style="color:#A35A00">${NA}</i>`}</td>`).join("")}<td style="${cell}">${c.platform==="instagram"?"Instagram":"RedNote"}${c.handle?"<br>"+esc(c.handle):""}</td><td style="${cell}">${esc(c.status)}</td></tr>`).join("")}</tbody></table>`;
  document.body.append(el);
  try{
    const scale=2,canvas=await html2canvas(el,{scale,backgroundColor:"#ffffff",logging:false});
    const {jsPDF}=window.jspdf;const doc=new jsPDF({orientation:"landscape",unit:"pt",format:"a4"});
    const M=40,pw=doc.internal.pageSize.getWidth()-2*M,ph=doc.internal.pageSize.getHeight()-2*M;
    const cssPerPt=el.offsetWidth/pw,pageCss=ph*cssPerPt,total=el.offsetHeight;
    // Break pages between table rows, never through one.
    const top=el.getBoundingClientRect().top;
    const bottoms=[...el.querySelectorAll("tbody tr")].map(r=>r.getBoundingClientRect().bottom-top);
    let start=0,first=true;
    while(start<total-1){
      let end=start+pageCss;
      if(end<total){const fit=bottoms.filter(b=>b>start+1&&b<=end);if(fit.length)end=fit[fit.length-1]}else end=total;
      const sy=Math.round(start*scale),sh=Math.min(Math.round((end-start)*scale),canvas.height-sy);
      const part=document.createElement("canvas");part.width=canvas.width;part.height=sh;
      part.getContext("2d").drawImage(canvas,0,sy,canvas.width,sh,0,0,canvas.width,sh);
      if(!first)doc.addPage();first=false;
      doc.addImage(part.toDataURL("image/jpeg",0.92),"JPEG",M,M,pw,sh/scale/cssPerPt);
      start=end;
    }
    return doc;
  }finally{el.remove()}
}
async function downloadPdf(filter){
  const list=S.candidates.filter(c=>filter==="shortlisted"?c.status==="shortlisted":filter==="active"?c.status!=="not a fit":true);
  if(!list.length){toast(t("No candidates match that filter"));return}
  if(!window.jspdf){toast(t("PDF tool didn't load. Check your connection and reload"));return}
  const sub=`${S.settings.company||"W2G Builder Claude"}  ·  Generated ${new Date().toLocaleDateString("en-MY",{day:"numeric",month:"long",year:"numeric"})}  ·  ${list.length} candidate${list.length>1?"s":""}  ·  Confidential: recruitment use only`;
  const NA="Not provided - ask candidate";
  let doc;
  if(HAS_CJK.test(sub+JSON.stringify(list.map(c=>[c.name,c.education,c.experience,c.handle])))){
    // The PDF's built-in fonts have no Chinese characters, so draw the table on screen and place it as an image.
    if(!window.html2canvas){toast(t("PDF tool didn't load. Check your connection and reload"));return}
    try{doc=await cjkPdfDoc(list,sub,NA)}catch(e){toast(t("Couldn't make the PDF. Try again"));return}
  }else{
  const {jsPDF}=window.jspdf;doc=new jsPDF({orientation:"landscape",unit:"pt",format:"a4"});
  doc.setFont("helvetica","bold");doc.setFontSize(18);doc.text("Candidate List",40,48);
  doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(90);
  doc.text(sub,40,66);
  doc.autoTable({startY:84,head:[["No.","NAME","EDUCATION BACKGROUND","WORKING EXPERIENCE","Source","Status"]],
    body:list.map((c,i)=>[i+1,c.name||NA,c.education||NA,c.experience||NA,(c.platform==="instagram"?"Instagram":"RedNote")+(c.handle?"\n"+c.handle:""),c.status]),
    styles:{fontSize:9,cellPadding:6,valign:"top",overflow:"linebreak"},headStyles:{fillColor:[21,26,45],textColor:255},
    alternateRowStyles:{fillColor:[245,246,250]},columnStyles:{0:{cellWidth:30},1:{cellWidth:120},2:{cellWidth:190},3:{cellWidth:230},4:{cellWidth:90},5:{cellWidth:70}},
    didParseCell:d=>{if(d.section==="body"&&d.cell.raw===NA){d.cell.styles.textColor=[163,90,0];d.cell.styles.fontStyle="italic"}}});
  }
  const name=`candidate-list-${ymd(new Date())}.pdf`;const blob=doc.output("blob");
  if(LOCAL){doc.save(name);toast(t("PDF saved to your Downloads folder"));return}
  if(!DOWNLOADS){toast(t("Downloads aren't available in this view. Open the app on claude.ai"));return}
  try{await DOWNLOADS.save({filename:name,data:blob});toast(t("PDF saved"))}catch(e){toast(e.code==="declined"?t("Download cancelled"):t("Couldn't save the PDF ({c})",{c:e.code}))}
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{S.tab=t.dataset.tab;render();scrollTo(0,0)});
try{const t=localStorage.getItem("bc-tab");if(t)S.tab=t}catch(e){}
window.addEventListener("beforeunload",()=>{try{localStorage.setItem("bc-tab",S.tab)}catch(e){}});
$("#lang-btn").onclick=()=>setLang(LANG==="zh"?"en":"zh");
render();initStore();
</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script></body></html>
